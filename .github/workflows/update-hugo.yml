name: Update Hugo Version

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  update-hugo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Get latest Hugo version
        id: latest
        run: |
          VERSION=$(curl -s https://api.github.com/repos/gohugoio/hugo/releases/latest | jq -r '.tag_name' | sed 's/v//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Latest Hugo: $VERSION"

      - name: Get current Hugo version
        id: current
        run: |
          VERSION=$(grep 'HUGO_VERSION' wrangler.toml | sed 's/.*= *"\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current Hugo: $VERSION"

      - name: Compare versions
        run: |
          echo "Latest:  ${{ steps.latest.outputs.version }}"
          echo "Current: ${{ steps.current.outputs.version }}"
          if [ "${{ steps.latest.outputs.version }}" != "${{ steps.current.outputs.version }}" ]; then
            echo "Versions differ — update needed"
          else
            echo "Already up to date — no PR needed"
          fi

      - name: Update wrangler.toml if outdated
        if: steps.latest.outputs.version != steps.current.outputs.version
        run: |
          sed -i 's/HUGO_VERSION = ".*"/HUGO_VERSION = "${{ steps.latest.outputs.version }}"/' wrangler.toml
          echo "Updated wrangler.toml"
          cat wrangler.toml

      - name: Open PR if changed
        if: steps.latest.outputs.version != steps.current.outputs.version
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: bump Hugo to v${{ steps.latest.outputs.version }}"
          title: "chore: bump Hugo to v${{ steps.latest.outputs.version }}"
          body: "Automated Hugo version bump. Check the [release notes](https://github.com/gohugoio/hugo/releases/tag/v${{ steps.latest.outputs.version }}) before merging."
          branch: bump-hugo-version
